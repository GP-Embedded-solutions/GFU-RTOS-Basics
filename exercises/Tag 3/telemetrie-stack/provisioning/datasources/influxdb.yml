apiVersion: 1
datasources:
  - name: InfluxDB-Kurs
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: kurs
      defaultBucket: echtzeit
      tlsSkipVerify: true
    secureJsonData:
      token: kurs-token-2026
